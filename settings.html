            <a class="navbar-brand logo" href="index.html">SocialSphere</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>

                </ul>
            </div>
        </div>
    </nav>
</header>

<main>
    <section class="settings-section">
        <div class="container">

            <div class="settings-card">
                <h1>Settings</h1>
                <p class="settings-subtitle">
                    Manage your SocialSphere profile.
                </p>

                <form>
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label for="name" class="form-label">Display name</label>
                            <input type="text" class="form-control" id="name" value="Ben">
                        </div>

                        <div class="col-md-6">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" value="ben">
                        </div>

                        <div class="col-12">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" value="ben@example.com">
                        </div>

                        <div class="col-12">
                            <label for="bio" class="form-label">Bio</label>
                            <textarea class="form-control" id="bio" rows="4">Another day, another adventure.</textarea>
                        </div>

                        <div class="col-md-6">
                            <label for="location" class="form-label">Location</label>
                            <input type="text" class="form-control" id="location" placeholder="City, Country">
                        </div>

                        <div class="col-md-6">
                            <label for="visibility" class="form-label">Profile visibility</label>
                            <select class="form-select" id="visibility">
                                <option selected>Everyone</option>
                                <option>Friends only</option>
                                <option>Only me</option>
                            </select>
                        </div>

                    </div>

                    <button type="submit" class="btn btn-primary mt-4">
                        Save changes
                    </button>
                </form>
            </div>

        </div>
    </section>
</main>
