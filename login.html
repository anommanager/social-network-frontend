                    </li>
                </ul>
            </div>

        </div>
    </nav>
</header>

<main>

    <section class="py-5">
        <div class="container">

            <div class="auth-card" id="authCard">

                <div id="authForms">

                    <ul class="nav nav-pills nav-fill mb-4">
                        <li class="nav-item">
                            <button type="button" class="nav-link active" id="showLogin">Sign in</button>
                        </li>
                        <li class="nav-item">
                            <button type="button" class="nav-link" id="showRegister">Register</button>
                        </li>
                    </ul>

                    <form id="loginForm" novalidate>
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">Email</label>
                            <input type="email" id="loginEmail" class="form-control" autocomplete="email">
                            <div class="invalid-feedback" id="loginEmailError"></div>
                        </div>

                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Password</label>
                            <input type="password" id="loginPassword" class="form-control" autocomplete="current-password">
                            <div class="invalid-feedback" id="loginPasswordError"></div>
                        </div>

                        <div id="loginMessage"></div>
                        <button type="submit" class="btn btn-primary w-100">Sign in</button>
                    </form>

                    <form id="registerForm" novalidate hidden>
                        <div class="mb-3">
                            <label for="regName" class="form-label">Name</label>
                            <input type="text" id="regName" class="form-control" autocomplete="name">
                            <div class="invalid-feedback" id="regNameError"></div>
                        </div>

                        <div class="mb-3">
                            <label for="regEmail" class="form-label">Email</label>
                            <input type="email" id="regEmail" class="form-control" autocomplete="email">
                            <div class="invalid-feedback" id="regEmailError"></div>
                        </div>

                        <div class="mb-3">
                            <label for="regPassword" class="form-label">Password</label>
                            <input type="password" id="regPassword" class="form-control" autocomplete="new-password">
                            <small class="text-muted">At least 8 characters, an uppercase letter and a digit.</small>
                            <div class="invalid-feedback" id="regPasswordError"></div>
                        </div>

                        <div class="mb-3">
                            <label for="regConfirm" class="form-label">Confirm password</label>
                            <input type="password" id="regConfirm" class="form-control" autocomplete="new-password">
                            <div class="invalid-feedback" id="regConfirmError"></div>
                        </div>

                        <div id="registerMessage"></div>
                        <button type="submit" class="btn btn-primary w-100">Create account</button>
                    </form>

                </div>

                <div id="signedInPanel" hidden>
                    <h2 class="mb-3">You are signed in</h2>
                    <p>Signed in as <strong id="signedInName"></strong> (<span id="signedInEmail"></span>).</p>
                    <button type="button" class="btn signout-btn">Sign out</button>
                </div>

            </div>

        </div>
    </section>

</main>
